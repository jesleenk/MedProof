name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact 0.31.1 toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1

      - name: Compile contract
        run: npm run compile

      - name: Sync proving assets
        run: npm run sync:assets

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production app
        run: npm run build
